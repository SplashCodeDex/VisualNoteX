[package]
name = "visualplanx-core"
version = "1.0.0"
description = "DeXStudios VisualPlanX - Enterprise-Grade Diagramming Desktop Platform"
authors = ["DeXStudios <splashdexstudios@gmail.com>"]
license = "Proprietary"
repository = "https://github.com/SplashCodeX/visualplanx"
edition = "2021"
rust-version = "1.77.2"

# DeXStudios Custom Flags
keywords = ["diagramming", "whiteboarding", "enterprise", "performance", "dexstudios"]
categories = ["productivity", "graphics", "utilities", "development-tools"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.8.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
chrono = { version = "0.4", features = ["serde"] }